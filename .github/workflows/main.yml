# .github/workflows/tests.yml — runs the tests automatically on every push
name: QuickChat CI
on:
  push:
    branches: [ "**" ]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: mvn -B clean compile
      - run: mvn -B test
